---
- name: Ensure persistent journal directory exists
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    owner: root
    group: systemd-journal
    mode: '2755'

- name: Ensure journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Configure persistent journald limits
  ansible.builtin.template:
    src: journald.conf.j2
    dest: /etc/systemd/journald.conf.d/60-virt-host.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart journald

- name: Set virtualization host sysctl parameters
  ansible.builtin.template:
    src: 60-virt-host.conf.j2
    dest: /etc/sysctl.d/60-virt-host.conf
    owner: root
    group: root
    mode: '0644'
  notify: Apply sysctl

- name: Enable and start chrony
  ansible.builtin.service:
    name: chrony
    enabled: true
    state: started
