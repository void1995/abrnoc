---
- name: Validate and reload SSH
  ansible.builtin.command: /bin/sh -c '/usr/sbin/sshd -t && /bin/systemctl reload ssh'
  changed_when: true

- name: Restart journald
  ansible.builtin.service:
    name: systemd-journald
    state: restarted

- name: Apply sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Apply virt-host firewall rules
  ansible.builtin.command: /usr/local/sbin/virt-host-nft-apply
  changed_when: true

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart node exporter
  ansible.builtin.service:
    name: prometheus-node-exporter
    state: restarted

- name: Restart libvirt metrics timer
  ansible.builtin.systemd:
    name: virt-host-metrics.timer
    state: restarted
    enabled: true
    daemon_reload: true

- name: Restart Prometheus
  ansible.builtin.service:
    name: prometheus
    state: restarted

- name: Restart Alertmanager
  ansible.builtin.service:
    name: prometheus-alertmanager
    state: restarted

- name: Restart blackbox exporter
  ansible.builtin.service:
    name: prometheus-blackbox-exporter
    state: restarted
