global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']

  - job_name: virt-host-metrics
    static_configs:
      - targets: ['127.0.0.1:9100']

  - job_name: alertmanager
    static_configs:
      - targets: ['127.0.0.1:9093']

# The Ansible template adds the blackbox job only when network_probe_targets is non-empty.
